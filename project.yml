name: MovieApp
options:
  bundleIdPrefix: com.company
  deploymentTarget:
    iOS: "16.0"
targets:
  MovieApp:
    type: application
    platform: iOS
    sources:
      - path: MovieApp
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.company.movieapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: YES
